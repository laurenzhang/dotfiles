# truecolor
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# vi keys in copy mode, mouse scrolling
setw -g mode-keys vi
set -g mouse on

# reload this file with <prefix> r
unbind r
bind r source-file ~/.tmux.conf \; display-message "reloaded"

# enter copy mode with <prefix> Esc, paste with <prefix> P
unbind [
bind Escape copy-mode
bind P paste-buffer

# status bar at the top
set -g status-position top

# plugins (install tpm first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, then <prefix> I)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
